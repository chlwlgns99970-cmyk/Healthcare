name: Daily official franchise menu audit
on:
  schedule:
    - cron: '17 19 * * *' # UTC 19:17 = Asia/Seoul 04:17 next day; schedules may be delayed.
  workflow_dispatch:
    inputs:
      verificationRunKey:
        description: 'Optional explicit operator validation run key (daily cron keeps KST date key)'
        required: false
        default: ''
      verificationOnlyBrands:
        description: 'Optional comma-separated operator verification brands; daily cron audits all brands'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: franchise-menu-publish
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Load previous published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --branch franchise-data --depth 1 https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git published
      - name: Test adapter and publish safety
        run: |
          python -m pip install lxml==6.1.1 playwright==1.63.0 pypdf==6.10.0
          python -m playwright install --with-deps --only-shell chromium
          python source/tools/test_franchise_daily_sync.py
          python source/tools/test_franchise_auto_audit.py
          python source/tools/test_franchise_completion.py
          python source/tools/test_franchise_browser.py
          python source/tools/test_franchise_nutrition.py
          python -m unittest discover -s source/tools -p 'test_franchise_nutrition_*.py'
      - name: Audit official sources and publish locally
        env:
          VERIFICATION_RUN_KEY: ${{ inputs.verificationRunKey }}
          VERIFICATION_ONLY_BRANDS: ${{ inputs.verificationOnlyBrands }}
        run: |
          if [ -n "$VERIFICATION_RUN_KEY" ]; then
            if [ -n "$VERIFICATION_ONLY_BRANDS" ]; then
              python source/tools/franchise_daily_sync.py --output published --run-key "$VERIFICATION_RUN_KEY" --brand-only "$VERIFICATION_ONLY_BRANDS"
            else
              python source/tools/franchise_daily_sync.py --output published --run-key "$VERIFICATION_RUN_KEY"
            fi
          else
            python source/tools/franchise_daily_sync.py --output published
          fi
      - name: Publish one atomic Git commit
        working-directory: published
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest.json catalog-*.json latest-franchise-sync-report.json latest-franchise-brand-status.json latest-franchise-nutrition-audit.json sync-history/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official franchise menu catalog"
            git push origin HEAD:franchise-data
          fi
      - name: Keep audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: franchise-sync-report
          path: published/latest-franchise-sync-report.json
